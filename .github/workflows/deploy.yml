name: Build & Deploy Chat App

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Verify TypeScript & Build Frontend
        run: |
          npm run lint
          npm run build

  deploy:
    name: Deploy to Cloud (Render / Web Service)
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Trigger Deploy Hook (Optional)
        # Jika kamu menambahkan secret RENDER_DEPLOY_HOOK di repository GitHub (Settings > Secrets and variables > Actions),
        # GitHub Action ini akan otomatis men-deploy aplikasi secara otomatis setiap ada push baru!
        run: |
          if [ -n "${{ secrets.RENDER_DEPLOY_HOOK }}" ]; then
            echo "Memanggil deploy hook..."
            curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK }}"
            echo "Deploy hook berhasil dikirim!"
          else
            echo "RENDER_DEPLOY_HOOK tidak diatur, melewati webhook deploy. (Jika menggunakan Render auto-deploy, Render akan deploy langsung dari GitHub)"
          fi
