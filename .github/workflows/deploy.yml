name: Deploy ke GitHub Pages

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

# Hak akses yang diperlukan untuk mempublikasikan web ke GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Menghindari penumpukan deploy bersamaan
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Web Application
        run: npm run build

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Artifact Hasil Build (dist)
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy ke GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Trigger Cloud Server Deploy (Opsional)
        # Jika kamu juga memasang backend di Render dan mengisi RENDER_DEPLOY_HOOK di GitHub Secrets
        if: env.RENDER_HOOK != ''
        env:
          RENDER_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          curl -X POST "$RENDER_HOOK"
          echo "Deploy hook server berhasil dikirim!"
